name: Build pipeline and publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Uses renv.lock if present, otherwise the Imports in DESCRIPTION
      - uses: r-lib/actions/setup-renv@v2
        if: hashFiles('renv.lock') != ''
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: hashFiles('renv.lock') == ''
        with:
          dependencies: '"hard"'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Run targets pipeline (validates data, fits models, renders site)
        run: Rscript -e 'targets::tar_make()'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
